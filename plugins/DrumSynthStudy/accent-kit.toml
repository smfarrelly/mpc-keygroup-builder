name = "SDK Ghost Accent Kit"
# Boom Kit accent samples are generated by plugins/DrumSynthStudy/build.py.

[[pads]]
pad = 1
color_category = "kick"
layers = [
  { sample = "Kick.wav", velocity_start = 0, velocity_end = 95 },
  { sample = "Boom Kick.wav", velocity_start = 96, velocity_end = 127 },
]

[[pads]]
pad = 2
color_category = "snare"
layers = [
  { sample = "Snare.wav", velocity_start = 0, velocity_end = 95 },
  { sample = "Boom Snare.wav", velocity_start = 96, velocity_end = 127 },
]

[[pads]]
pad = 3
color_category = "clap"
sample = "Clap.wav"

[[pads]]
pad = 4
color_category = "closed_hat"
mute_group = 1
layers = [
  { sample = "Closed Hat.wav", velocity_start = 0, velocity_end = 95 },
  { sample = "Boom Closed Hat.wav", velocity_start = 96, velocity_end = 127 },
]

[[pads]]
pad = 5
color_category = "open_hat"
mute_group = 1
layers = [
  { sample = "Open Hat.wav", velocity_start = 0, velocity_end = 95 },
  { sample = "Boom Open Hat.wav", velocity_start = 96, velocity_end = 127 },
]

[[pads]]
pad = 6
color_category = "tom"
sample = "Low Tom.wav"

[[pads]]
pad = 7
color_category = "tom"
sample = "High Tom.wav"

[[pads]]
pad = 8
color_category = "percussion"
sample = "Percussion.wav"
