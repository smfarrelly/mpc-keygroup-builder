name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: pytest -q
      - name: Validate published declarative examples
        run: |
          mpc-schema validate device-profile devices/*.toml
          mpc-schema validate drum-manifest inventory/fg-vinyl-layered-kit.toml
          mpc-schema validate layout-preset layouts/*.toml
          mpc-schema validate keygroup-variant variants/keygroups/*.toml
          mpc-schema validate midi-device midi/devices/*.toml
          mpc-schema validate midi-control-map midi/maps/*.toml
          mpc-schema validate plugin-profile midi/plugins/*.toml
          mpc-schema validate rig-profile rigs/*.toml
          mpc-schema validate controller-capacity midi/controller-capacity.toml
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/mpc-wheel
          python -m venv /tmp/mpc-installed
          /tmp/mpc-installed/bin/python -m pip install /tmp/mpc-wheel/*.whl
          cd /tmp
          /tmp/mpc-installed/bin/mpc-tools doctor
          /tmp/mpc-installed/bin/mpc-schema show plugin-profile --output /tmp/plugin-profile.schema.json
          /tmp/mpc-installed/bin/mpc-tools demo --output /tmp/mpc-portable-smoke
          test -f /tmp/mpc-portable-smoke/HARDWARE_CHECKLIST.md
      - run: mpc-repository-guard
