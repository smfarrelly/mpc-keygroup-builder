name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Install the locked development environment
        run: uv sync --locked
      - name: Run the test suite
        run: uv run python -m unittest discover -s tests -v
      - name: Validate published declarative examples
        run: |
          uv run mpc-schema validate device-profile devices/*.toml
          uv run mpc-schema validate drum-manifest inventory/fg-vinyl-layered-kit.toml
          uv run mpc-schema validate drum-recipe recipes/drums/*.toml
          uv run mpc-schema validate harmony-recipe recipes/harmony/*.toml
          uv run mpc-schema validate melody-recipe recipes/melody/*.toml
          uv run mpc-schema validate workstation-recipe recipes/workstation/*.toml
          uv run mpc-schema validate kit-recipe recipes/kits/*.toml
          uv run mpc-schema validate layout-preset layouts/*.toml
          uv run mpc-schema validate keygroup-variant variants/keygroups/*.toml
          uv run mpc-schema validate midi-device midi/devices/*.toml
          uv run mpc-schema validate midi-control-map midi/maps/*.toml
          uv run mpc-schema validate plugin-profile midi/plugins/*.toml
          uv run mpc-schema validate rig-profile rigs/*.toml
          uv run mpc-schema validate controller-capacity midi/controller-capacity.toml
          uv run mpc-recipe-audit recipes --output /tmp/mpc-recipe-audit
      - name: Smoke-test the installed wheel outside the checkout
        run: |
          python -m pip wheel . --no-deps --wheel-dir /tmp/mpc-wheel
          python -m venv /tmp/mpc-installed
          /tmp/mpc-installed/bin/python -m pip install /tmp/mpc-wheel/*.whl
          cd /tmp
          /tmp/mpc-installed/bin/mpc-tools doctor
          /tmp/mpc-installed/bin/mpc-schema show plugin-profile --output /tmp/plugin-profile.schema.json
          /tmp/mpc-installed/bin/mpc-schema init workstation --family ambient --output /tmp/mpc-recipe-starter
          /tmp/mpc-installed/bin/mpc-recipe-audit /tmp/mpc-recipe-starter --output /tmp/mpc-installed-recipe-audit
          /tmp/mpc-installed/bin/mpc-tools new controller-page --name "CI Controller" --output /tmp/mpc-controller-starter
          /tmp/mpc-installed/bin/mpc-workstation-wave /tmp/mpc-recipe-starter --families ambient --seeds-per-family 1 --output /tmp/mpc-wave-smoke
          /tmp/mpc-installed/bin/mpc-creative-review /tmp/mpc-wave-smoke/wave.json --output /tmp/mpc-wave-review.html
          /tmp/mpc-installed/bin/mpc-tools demo --output /tmp/mpc-portable-smoke
          /tmp/mpc-installed/bin/mpc-bundle-verify /tmp/mpc-portable-smoke
          /tmp/mpc-installed/bin/mpc-showcase --output /tmp/mpc-showcase-smoke
          test -f /tmp/mpc-portable-smoke/HARDWARE_CHECKLIST.md
          test -f /tmp/mpc-showcase-smoke/Compositions/electro/Sequences/outro.mid
      - run: uv run mpc-repository-guard
