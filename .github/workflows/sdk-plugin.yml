name: sdk-plugin

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'midi/sdk-examples/**'
      - 'midi/sdk-kits/**'
      - 'src/mpc_keygroup_builder/sdk_*.py'
      - '.github/workflows/sdk-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: inmusic-software/mpc-plugin-builder-sdk
          ref: febd2ca5bd9eb16c4a412837196e145566bc981b
          path: work/akai-sdk
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify source, simulator behavior, mapping contract and timing
        run: |
          python -m pip install .
          sdk=work/akai-sdk
          plugin=plugins/LoopThrow
          python "$sdk/tools/build.py" "$plugin" --target native --toolchain gcc
          c++ -std=c++17 -O2 -I"$sdk/framework" "$plugin/tests/impulse.cpp" -o "$plugin/build/impulse-test"
          "$plugin/build/impulse-test"
          python "$plugin/tests/audition_smoke.py" "$sdk"
          mpc-sdk-review "$plugin/build/native/loop-throw.so" --host-sim "$sdk/.sdk-tools/host_sim" \
            --baseline "$plugin/params.reference.json" --profile midi/sdk-examples/loop-throw.toml \
            --output work/loop-throw-review
      - name: Check the curated instrument pages against the SDK examples
        run: |
          sdk=work/akai-sdk
          for pair in 'DrumSynth drum-synth' 'SimpleSynth simple-synth'; do
            read -r instrument page <<< "$pair"
            python "$sdk/tools/build.py" "$sdk/examples/$instrument" --target native --toolchain gcc
            mpc-plugin-map check "midi/sdk-examples/$page.toml" --sdk-dump "$sdk/examples/$instrument/build/params.json"
          done
      - name: Sample and verify the portable Drum Synth kit
        run: |
          sdk=work/akai-sdk
          mpc-sdk-kit midi/sdk-kits/drum-synth.toml "$sdk/examples/DrumSynth/build/native/drum-synth.so" --host-sim "$sdk/.sdk-tools/host_sim" --output work/sdk-kit
          mpc-bundle-verify work/sdk-kit
          mpc-program-audition "work/sdk-kit/SDK Drum Synth Kit.xpm" --drum-bank A --output work/sdk-kit-bank-a.wav
          python plugins/DrumSynthStudy/build.py --sdk "$sdk" --baseline work/sdk-kit --output work/ghost-accents
          mpc-bundle-verify work/ghost-accents
      - name: Render a drum take with the SDK Simple Synth
        run: python plugins/SimpleSynthStudy/smoke.py work/akai-sdk "work/sdk-kit/SDK Drum Synth Kit.xpm"
      - name: Sample the SDK synth into an MPC Keygroup
        run: MPC_TEST_SDK=work/akai-sdk python -m unittest discover -s tests -p test_sdk_sampled_keys.py -v
      - name: Exercise the playable Scratchpad instruments and beat capture
        run: |
          sdk=work/akai-sdk
          for plugin in PocketLayers BloomKeys BeatCatch; do
            python "$sdk/tools/build.py" "plugins/$plugin" --target native --toolchain gcc
            "$sdk/.sdk-tools/host_sim" plugins/"$plugin"/build/native/*.so test --notes 36 --playing
          done
          python plugins/PlayableScratchpad/smoke.py "$sdk"
      - name: Record and reopen a native Pocket Duo performance
        run: |
          sdk=work/akai-sdk
          plugin=plugins/PocketDuo
          python "$sdk/tools/build.py" "$plugin" --target native --toolchain gcc
          "$sdk/.sdk-tools/host_sim" "$plugin/build/native/pocket-duo.so" test --notes 36,38,42 --playing
          c++ -std=c++17 -O2 -I"$sdk/framework" "$plugin/tests/session.cpp" -o "$plugin/build/session"
          "$plugin/build/session"
          c++ -std=c++17 -O2 -I"$sdk/framework" "$plugin/tests/reopen.cpp" -ldl -o "$plugin/build/reopen"
          "$plugin/build/reopen" "$plugin/build/native/pocket-duo.so"
      - name: Exercise live fills, drum resonators and taught chords
        run: |
          sdk=work/akai-sdk
          for plugin in Turnaround ResonantKit ChordRelay; do
            python "$sdk/tools/build.py" "plugins/$plugin" --target native --toolchain gcc
            "$sdk/.sdk-tools/host_sim" plugins/"$plugin"/build/native/*.so test --notes 36,40 --playing
          done
          c++ -std=c++17 -O2 -I"$sdk/framework" plugins/LiveJam/tests/session.cpp -o work/live-jam-test
          work/live-jam-test
      - name: Record, reopen and render the drummer performance instruments
        run: |
          sdk=work/akai-sdk
          for plugin in GhostWire RudimentKeys RestReply SplitCycle DrumSeat; do
            python "$sdk/tools/build.py" "plugins/$plugin" --target native --toolchain gcc
            "$sdk/.sdk-tools/host_sim" plugins/"$plugin"/build/native/*.so test --notes 36,37,40,41 --playing
          done
          c++ -std=c++17 -O2 -I"$sdk/framework" plugins/DrumHands/tests/session.cpp -ldl -o work/drum-hands-test
          work/drum-hands-test plugins
          python plugins/DrumHands/rehearsal.py --sdk "$sdk" --output work/drum-hands-rehearsal
          mpc-bundle-verify work/drum-hands-rehearsal
          mpc-sdk-compare plugins/DrumSeat/params.reference.json plugins/DrumSeat/build/params.json
          mpc-plugin-map check midi/sdk-examples/drum-seat.toml --sdk-dump plugins/DrumSeat/build/params.json
      - name: Capture a beat, audition variations and reopen harmonic memories
        run: |
          sdk=work/akai-sdk
          for plugin in ShadowSteps CommonTone; do
            python "$sdk/tools/build.py" "plugins/$plugin" --target native --toolchain gcc
            "$sdk/.sdk-tools/host_sim" plugins/"$plugin"/build/native/*.so test --notes 36,37,67 --playing
            c++ -std=c++17 -O2 -I"$sdk/framework" plugins/"$plugin"/tests/session.cpp -ldl -o "work/$plugin-test"
            "work/$plugin-test" plugins/"$plugin"/build/native/*.so
          done
          python plugins/ShadowSteps/tests/printer.py
          python plugins/ShadowSteps/jam.py --sdk "$sdk" --output work/shadow-steps-jam
          mpc-bundle-verify work/shadow-steps-jam
      - name: Play and restore learned Phrase Hands melodies
        run: |
          sdk=work/akai-sdk
          plugin=plugins/PhraseHands
          python "$sdk/tools/build.py" "$plugin" --target native --toolchain gcc
          c++ -O2 -std=c++17 -I"$sdk/framework" "$plugin/tests/session.cpp" -ldl -o "$plugin/build/session"
          "$plugin/build/session" "$plugin/build/native/phrase-hands.so"
      - name: Verify expressive inserts and groove transfer through the native host
        run: |
          sdk=work/akai-sdk
          for plug in GhostFader RhythmImprint TailChoir; do
            python "$sdk/tools/build.py" "plugins/$plug" --target native --toolchain gcc
            "$sdk/.sdk-tools/host_sim" plugins/"$plug"/build/native/*.so test --playing
          done
          c++ -std=c++17 -O2 -I"$sdk/framework" plugins/PerformanceEffects/session.cpp -ldl -o work/performance-effects-test
          mkdir -p work/imprint-fixture/Content
          python -c "from pathlib import Path; Path('work/imprint-fixture/Content/slot-1.gri').write_bytes(bytes((1,1,0,4,127)))"
          MPC_PLUGIN_FOLDER="$PWD/work/imprint-fixture" work/performance-effects-test plugins/{GhostFader,RhythmImprint,TailChoir}/build/native/*.so
      - name: Verify played slice order, bank switching and touch-driven sampled bodies
        run: |
          sdk=work/akai-sdk
          for plug in BreakRelay BodyPrint; do
            python "$sdk/tools/build.py" "plugins/$plug" --target native --toolchain gcc
            "$sdk/.sdk-tools/host_sim" plugins/"$plug"/build/native/*.so test --playing --notes 36,37,38,39
            c++ -O2 -std=c++17 -I"$sdk/framework" plugins/"$plug"/tests/session.cpp -ldl -o "work/$plug-session"
          done
          python plugins/BreakRelay/tests/fixture.py work/relay-fixture
          MPC_PLUGIN_FOLDER="$PWD/work/relay-fixture" work/BreakRelay-session plugins/BreakRelay/build/native/break-relay.so
          work/BodyPrint-session plugins/BodyPrint/build/native/body-print.so
          python plugins/BreakRelay/rehearsal.py --sdk "$sdk" --output work/relay-demo
          mpc-bundle-verify work/relay-demo
      - name: Check mastering inserts on stereo passages at four sample rates
        run: |
          sdk=work/akai-sdk
          for plugin in PeakFinish StereoFocus SectionCheck; do
            python "$sdk/tools/build.py" "plugins/$plugin" --target native --toolchain gcc
            "$sdk/.sdk-tools/host_sim" plugins/"$plugin"/build/native/*.so test --playing
          done
          c++ -std=c++17 -O2 -I"$sdk/framework" plugins/Mastering/session.cpp -ldl -o work/mastering-test
          work/mastering-test plugins/{PeakFinish,StereoFocus,SectionCheck}/build/native/*.so
