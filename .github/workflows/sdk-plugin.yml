name: sdk-plugin

on:
  pull_request:
    paths:
      - 'plugins/**'
      - 'midi/sdk-examples/**'
      - 'midi/sdk-kits/**'
      - 'src/mpc_keygroup_builder/sdk_*.py'
      - '.github/workflows/sdk-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: inmusic-software/mpc-plugin-builder-sdk
          ref: febd2ca5bd9eb16c4a412837196e145566bc981b
          path: work/akai-sdk
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify source, simulator behavior, mapping contract and timing
        run: |
          python -m pip install .
          sdk=work/akai-sdk
          plugin=plugins/LoopThrow
          python "$sdk/tools/build.py" "$plugin" --target native --toolchain gcc
          c++ -std=c++17 -O2 -I"$sdk/framework" "$plugin/tests/impulse.cpp" -o "$plugin/build/impulse-test"
          "$plugin/build/impulse-test"
          python "$plugin/tests/audition_smoke.py" "$sdk"
          mpc-sdk-review "$plugin/build/native/loop-throw.so" --host-sim "$sdk/.sdk-tools/host_sim" \
            --baseline "$plugin/params.reference.json" --profile midi/sdk-examples/loop-throw.toml \
            --output work/loop-throw-review
      - name: Check the curated instrument pages against the SDK examples
        run: |
          sdk=work/akai-sdk
          for pair in 'DrumSynth drum-synth' 'SimpleSynth simple-synth'; do
            read -r instrument page <<< "$pair"
            python "$sdk/tools/build.py" "$sdk/examples/$instrument" --target native --toolchain gcc
            mpc-plugin-map check "midi/sdk-examples/$page.toml" --sdk-dump "$sdk/examples/$instrument/build/params.json"
          done
      - name: Sample and verify the portable Drum Synth kit
        run: |
          sdk=work/akai-sdk
          mpc-sdk-kit midi/sdk-kits/drum-synth.toml "$sdk/examples/DrumSynth/build/native/drum-synth.so" --host-sim "$sdk/.sdk-tools/host_sim" --output work/sdk-kit
          mpc-bundle-verify work/sdk-kit
          mpc-program-audition "work/sdk-kit/SDK Drum Synth Kit.xpm" --drum-bank A --output work/sdk-kit-bank-a.wav
          python plugins/DrumSynthStudy/build.py --sdk "$sdk" --baseline work/sdk-kit --output work/ghost-accents
          mpc-bundle-verify work/ghost-accents
