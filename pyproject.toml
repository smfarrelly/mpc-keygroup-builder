[project]
name = "mpc-keygroup-builder"
version = "0.1.0"
description = "Build and validate MPC 3 keygroup programs from pitched WAV libraries"
license = "MIT"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
mpc-keygroup = "mpc_keygroup_builder.cli:main"
mpc-keygroup-batch = "mpc_keygroup_builder.workflow:main"
mpc-program-test = "mpc_keygroup_builder.testing:main"
mpc-program-audition = "mpc_keygroup_builder.audition:main"
mpc-program-color = "mpc_keygroup_builder.programs:main"
mpc-project-capture = "mpc_keygroup_builder.capture:main"
mpc-hardware-results = "mpc_keygroup_builder.hardware:main"
mpc-drum-audit = "mpc_keygroup_builder.drum_audit:main"
mpc-xpm = "mpc_keygroup_builder.xpm:main"
mpc-drum-map = "mpc_keygroup_builder.drum_map:main"
mpc-drum-build = "mpc_keygroup_builder.drum_builder:main"
mpc-drum-compose = "mpc_keygroup_builder.drum_compose:main"
mpc-loop-inventory = "mpc_keygroup_builder.loop_inventory:main"
mpc-ableton = "mpc_keygroup_builder.ableton:main"
mpc-ableton-backlog = "mpc_keygroup_builder.ableton_backlog:main"
mpc-ableton-drum = "mpc_keygroup_builder.ableton_drum:main"
mpc-program-model = "mpc_keygroup_builder.model:main"
mpc-program-designer = "mpc_keygroup_builder.designer:main"
mpc-keygroup-variant = "mpc_keygroup_builder.keygroup_variant:main"
mpc-layout = "mpc_keygroup_builder.layout:main"
mpc-layout-export = "mpc_keygroup_builder.layout_export:export_main"
mpc-layout-verify = "mpc_keygroup_builder.layout_export:verify_main"
mpc-layout-package = "mpc_keygroup_builder.layout_export:package_main"
mpc-layout-draft = "mpc_keygroup_builder.layout_draft:main"
mpc-scratchpad-check = "mpc_keygroup_builder.candidates:main"
mpc-hardware-init = "mpc_keygroup_builder.hardware:init_main"
mpc-sd-deploy = "mpc_keygroup_builder.deploy:main"
mpc-package-deploy = "mpc_keygroup_builder.package_deploy:main"
mpc-audio-levels = "mpc_keygroup_builder.levels:main"
mpc-routing-capture = "mpc_keygroup_builder.routing:main"
mpc-repository-guard = "mpc_keygroup_builder.guardrails:main"
mpc-rig = "mpc_keygroup_builder.rig:main"
mpc-library = "mpc_keygroup_builder.library:main"
mpc-catalog = "mpc_keygroup_builder.catalog:main"
mpc-drum-idea = "mpc_keygroup_builder.ideas:main"
mpc-harmony-idea = "mpc_keygroup_builder.harmony:main"
mpc-melody-idea = "mpc_keygroup_builder.melody:main"
mpc-workstation-idea = "mpc_keygroup_builder.workstation:main"
mpc-arrange-idea = "mpc_keygroup_builder.arrangement:main"
mpc-session-report = "mpc_keygroup_builder.session:main"
mpc-plugin-audit = "mpc_keygroup_builder.plugin_audit:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
