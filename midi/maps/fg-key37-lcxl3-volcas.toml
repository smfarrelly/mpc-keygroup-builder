schema_version = 1
name = "FG Key 37 + Launch Control XL 3 + Volcas"
description = "Four reusable Launch Control modes: one MPC mix surface and direct parameter surfaces for the Volca Bass, Keys, and Drum routed through MPC MIDI tracks."
device_definitions = ["volca-bass.toml", "volca-keys.toml", "volca-drum.toml"]
sources = [
  "https://support.akaipro.com/en/support/solutions/articles/69000858700-mpc-series-mapping-plugin-parameters-in-mpc-standalone-and-mpc-2-0-mpc-beats",
  "https://support.akaipro.com/en/support/solutions/articles/69000804431-akai-pro-mpc-series-configuring-midi-ports-for-multi-midi-control",
  "https://support.akaipro.com/en/support/solutions/articles/69000871268-akai-pro-mpc-key-37-using-the-mpc-key-37-as-a-midi-controller",
  "https://fael-downloads-prod.focusrite.com/customer/prod/downloads/launch_control_xl_3_programmer_s_reference_guide-pdf_en.pdf",
  "https://support.novationmusic.com/hc/en-gb/articles/27203903097362-Launch-Control-XL-3-Components-guide",
  "https://userguides.novationmusic.com/hc/en-gb/articles/26190491669650-Using-Launch-Control-XL-3-outside-of-a-DAW",
]

[topology]
launch_to_mpc = "usb"
mpc_to_devices = "passive-thru"
launch_direct_din = false
midi_merger = false

[[routes]]
track = "Volca Bass Control"
device = "volca-bass"
input_port = "Launch Control XL 3 MIDI"
input_channel = 1
output_port = "MPC MIDI Out"
output_channel = 1
monitor = "auto"
clock = "receive"

[[routes]]
track = "Volca Keys Control"
device = "volca-keys"
input_port = "Launch Control XL 3 MIDI"
input_channel = 2
output_port = "MPC MIDI Out"
output_channel = 2
monitor = "auto"
clock = "receive"

[[routes]]
track = "Volca Drum Control"
device = "volca-drum"
input_port = "Launch Control XL 3 MIDI"
input_channel = 10
output_port = "MPC MIDI Out"
output_channel = 10
monitor = "auto"
clock = "receive"

